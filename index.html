<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏆 說故事比賽特訓・選一本開始練習</title>
<style>
:root{--bg:#FFF7EA;--ink:#3A2E1F;--orange:#FF8A3D;--green:#3FA34D;--pink:#FF5D8F;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:40px;margin:6px 0}
.sub{font-size:22px;opacity:.75;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.book{background:var(--card);border:4px solid #FFE3C2;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column}
.book img{width:100%;height:220px;object-fit:cover;display:block;background:#fff}
.book .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.book h2{margin:0;font-size:30px}
.badge{align-self:flex-start;background:var(--green);color:#fff;border-radius:999px;padding:4px 16px;font-size:18px}
.go{margin-top:auto;text-align:center;background:var(--orange);color:#fff;font-weight:700;font-size:24px;border-radius:14px;padding:14px;text-decoration:none}
.go:hover{filter:brightness(1.05)}
.foot{margin-top:26px;font-size:18px;opacity:.65;text-align:center}
@media(max-width:560px){h1{font-size:32px}.book h2{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏆 說故事比賽特訓</h1>
  <p class="sub">小二比賽訓練版・選一本開始練習</p>
  <div class="grid" id="shelf"></div>
  <p class="foot">每本 8 關：開場 → 故事 → 結尾，附注音、動作小卡與錄音練習</p>
</div>
<script>
// ===== 新增故事書：在下面加一行即可 =====
// 格式：{ title:書名, file:HTML路徑, cover:封面圖路徑, levels:關卡數 }
const BOOKS = [
  { title:"《我只想吃好吃的！》", file:"818_繪本/說故事訓練_我只想吃好吃的.html", cover:"818_繪本/images/P0_bow.png", levels:8 },
  { title:"《灰姑娘》", file:"818_繪本/說故事訓練_灰姑娘.html", cover:"818_繪本/images/cj_5_dance.png", levels:8 },
];
const shelf = document.getElementById('shelf');
BOOKS.forEach(b => {
  const d = document.createElement('div');
  d.className = 'book';
  d.innerHTML = `<img src="${b.cover}" alt="${b.title}封面"><div class="body"><h2>${b.title}</h2><span class="badge">${b.levels} 關挑戰</span><a class="go" href="${b.file}">開始練習 →</a></div>`;
  shelf.appendChild(d);
});
</script>
</body>
</html>
